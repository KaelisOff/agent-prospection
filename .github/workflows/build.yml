name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Tests
        run: make test
      - name: Tag matches the manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "$GITHUB_REF_NAME" = "v$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' manifest.toml)"
      - name: Reproducible package
        run: make verify
      - uses: actions/upload-artifact@v4
        with:
          name: kagent
          path: dist/*.kagent

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kagent
          path: dist
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.kagent --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --notes "Paquet reproductible : make verify le reconstruit à l'identique."
