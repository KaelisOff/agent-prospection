# Le manifeste de l'agent : https://github.com/KaelisOff/agent-sdk-go/blob/main/docs/manifeste.md
id = "io.github.kaelisoff.prospection"
name = "Prospection"
version = "0.2.0"
description = "Trouve des entreprises de vos cibles dans l'annuaire officiel, leur adresse de contact générique sur leur propre site, et leur écrit un email court, amélioré par des tests A/B. Un point chaque matin, les réponses intéressées tout de suite, vos accords quand il faut."
author = "Kaelis"
license = "Apache-2.0"
source = "https://github.com/KaelisOff/agent-prospection"

[run]
memory_mb = 128
timeout_min = 20

[permissions]
model = true
notify = true
approval = true
storage_kb = 4096
schedule = ["30 8 * * 1-5", "0 10 * * 1-5", "0 14 * * 1-5", "30 16 * * 1-5"]
mail_send = 200
mail_read = true
web_search = 100
companies = true

[[settings]]
key = "offer"
label = "Votre offre, en deux ou trois phrases"
type = "textarea"
required = true
max_length = 1000
help = "Ce que vous proposez et à qui. Les messages sont écrits à partir de ce texte : n'y mettez que ce qui est vrai."

[[settings]]
key = "sender_name"
label = "Votre nom"
type = "text"
required = true
max_length = 80
help = "Il signe les emails. La boîte l'écrit en bas de chaque email, avec la société, l'adresse et la mention « répondez STOP » : c'est obligatoire en prospection."

[[settings]]
key = "company"
label = "Votre société"
type = "text"
required = true
max_length = 120

[[settings]]
key = "postal_address"
label = "Adresse postale de la société"
type = "text"
required = true
max_length = 200
help = "Sur une ligne, par exemple : 12 rue de la Paix, 75002 Paris."

[[settings]]
key = "activities"
label = "Métiers visés"
type = "list"
required = true
max_length = 60
help = "Codes NAF (43.22A pour la plomberie, 43.21A pour l'électricité…) ou mots du nom des entreprises."

[[settings]]
key = "places"
label = "Lieux visés"
type = "list"
required = true
max_length = 5
help = "Codes postaux (75011) ou départements (69, 2A)."

[[settings]]
key = "review"
label = "Valider chaque nouveau message avant envoi"
type = "toggle"
default = true
help = "Désactivé : l'agent écrit et teste ses messages seul ; vous les voyez dans les notifications."

[[settings]]
key = "daily"
label = "Emails par jour au maximum"
type = "number"
default = 20
min = 1
max = 200
help = "La boîte applique aussi sa propre limite (20 par jour au début, puis elle augmente chaque semaine)."

[[settings]]
key = "tone"
label = "Vouvoyer ou tutoyer"
type = "choice"
choices = ["vous", "tu"]
default = "vous"

[[settings]]
key = "sole_traders"
label = "Écrire aussi aux entrepreneurs individuels"
type = "toggle"
default = false
help = "Leur nom est celui d'une personne : seules les adresses génériques (contact@…) sont utilisées."

[[settings]]
key = "report_by_email"
label = "Recevoir aussi le point du jour et les réponses intéressées par email"
type = "toggle"
default = false
help = "Envoyés à la boîte mail que vous avez connectée dans la Messagerie. Attention : ils quittent alors la boîte Kaelis."
